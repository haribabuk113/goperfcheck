version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    govet:
      enable:
        - shadow
  exclusions:
    rules:
      - path: checker/
        linters: [errcheck]

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/haribabuk113/goperfcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0