name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-action:
    name: Self-test composite action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run action against this repo (INFO, no fail)
        uses: ./
        with:
          dir: .
          severity: INFO
        continue-on-error: true

      - name: Run action with SARIF output
        uses: ./
        with:
          dir: .
          severity: WARN
          sarif-file: results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true
